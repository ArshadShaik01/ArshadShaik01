<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="186" viewBox="0 0 1200 186" role="img" aria-labelledby="focus-title focus-desc">
<title id="focus-title">Three engineering focus areas</title>
<desc id="focus-desc">Applied AI: RAG, agent workflows and LLM evaluation. Cloud platforms: Kubernetes, AKS, Terraform. Production reliability: Observability, security and safer delivery.</desc>
<defs>
  <linearGradient id="focus-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset="1" stop-color="#270D1B"/></linearGradient>
  <linearGradient id="focus-border" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#451126"/><stop offset="0.5" stop-color="#C77B9B"/><stop offset="1" stop-color="#451126"/></linearGradient>
  <pattern id="focus-grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#E5B5C7" stroke-opacity=".055" fill="none"/></pattern>
</defs>
<rect width="1200" height="186" rx="19" fill="url(#focus-bg)"/>
<rect width="1200" height="186" rx="19" fill="url(#focus-grid)"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="24" y="26" width="366" height="134" rx="15" fill="#1B0B13" stroke="#C77B9B" stroke-opacity=".45"/>
  <rect x="417" y="26" width="366" height="134" rx="15" fill="#1B0B13" stroke="#C77B9B" stroke-opacity=".32"/>
  <rect x="810" y="26" width="366" height="134" rx="15" fill="#1B0B13" stroke="#C77B9B" stroke-opacity=".45"/>
  <g fill="#C77B9B" font-size="14" font-weight="700" letter-spacing="2"><text x="52" y="59">01 / AI SYSTEMS</text><text x="445" y="59">02 / CLOUD PLATFORMS</text><text x="838" y="59">03 / RELIABILITY</text></g>
  <g fill="#F8F0F3" font-size="25" font-weight="700"><text x="52" y="101">Grounded intelligence</text><text x="445" y="101">Infrastructure at scale</text><text x="838" y="101">Production by design</text></g>
  <g fill="#E5B5C7" font-size="15"><text x="52" y="130">RAG · agents · evaluation</text><text x="445" y="130">Kubernetes · AKS · IaC</text><text x="838" y="130">Security · tracing · CI/CD</text></g>
</g>
</svg>