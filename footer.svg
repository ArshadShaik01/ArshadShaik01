<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="ars-footer-title">
<title id="ars-footer-title">Arshad Shaik — Build with clarity. Ship with confidence.</title>
<defs><linearGradient id="ars-footer-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="1" stop-color="#451126"/></linearGradient><linearGradient id="ars-footer-stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></linearGradient></defs>
<rect width="1200" height="100" rx="17" fill="url(#ars-footer-bg)"/>
<path d="M50 22H1150" stroke="url(#ars-footer-stroke)" stroke-opacity=".72" stroke-width="2" stroke-dasharray="250 850"><animate attributeName="stroke-dashoffset" from="1100" to="0" dur="16s" repeatCount="indefinite"/></path>
